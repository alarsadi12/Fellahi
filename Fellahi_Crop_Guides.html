<script>
const data={
ar:{heading:"أدلة المحاصيل",sub:"إرشادات عملية للعناية بأهم المحاصيل.",back:"العودة إلى التطبيق",disc:"هذه إرشادات عامة وليست وصفة تسميد أو علاج ثابتة. تختلف التوصيات حسب الصنف والمنطقة والتربة والماء والطقس. استشر مهندساً زراعياً محلياً قبل القرارات المكلفة أو استخدام المبيدات.",names:["الأفوكادو","الزيتون","الخروب","الطماطم","البطيخ"],guides:[
["الأفوكادو","الأفوكادو حساس لتشبع التربة بالماء والملوحة، ويحتاج إلى صرف جيد وري منتظم دون إغراق.",[["الماء والصرف","راقب رطوبة منطقة الجذور بانتظام. تجنب بقاء الماء راكداً حول الجذع، وافحص النقاطات والتسرب. راعِ أن التربة الرملية تجف أسرع من الثقيلة."],["التغذية","اعتمد على تحليل التربة والماء ومراقبة النمو. قسّم التسميد عند الحاجة وفق مرحلة الشجرة، ولا ترفع الآزوت عشوائياً؛ فالنمو الخضري المفرط قد لا يخدم الإثمار."],["ملاحظة الشجرة","راقب احتراق حواف الأوراق، الاصفرار، تساقط الأوراق أو الثمار. هذه الأعراض قد ترتبط بالملوحة أو الماء أو الجذور أو التغذية، ولا تكفي وحدها لتحديد السبب."]],"ملاحظة: الأشجار الصغيرة تحتاج عناية خاصة بالجذور والري، ولا تطبق جرعات أشجار بالغة عليها."],
["الزيتون","شجرة الزيتون تتحمل الجفاف نسبياً بعد التأسيس، لكن الإنتاج الجيد يستفيد من إدارة متوازنة للماء والتربة والتقليم.",[["السقي","تختلف الحاجة حسب عمر الشجرة والتربة والأمطار والحمل. تجنب الإفراط في السقي، خصوصاً في الأراضي سيئة الصرف، وراقب رطوبة منطقة الجذور."],["التقليم","يهدف التقليم إلى تحسين دخول الضوء والتهوية وإزالة الأغصان الميتة أو المتزاحمة. تجنب التقليم الجائر الذي يزيل جزءاً كبيراً من المجموع الخضري دفعة واحدة."],["التغذية والإنتاج","حلل التربة أو الأوراق عند الإمكان قبل اختيار برنامج التسميد. تابع الإزهار والعقد والحمل، لأن احتياجات الشجرة تختلف بين سنة وأخرى."]],"ملاحظة: لا توجد جرعة أو مواعيد موحدة لكل بستان؛ الصنف والعمر والمناخ والحمل عوامل أساسية."],
["الخروب","الخروب شجرة متوسطية تتحمل ظروفاً جافة نسبياً بعد ترسخ جذورها، ويكون تأسيس الشتلات أهم مرحلة في نجاح الغرس.",[["مرحلة التأسيس","وفر رياً مساعداً منتظماً حسب جفاف التربة والطقس، دون إغراق. حافظ على خلو محيط الشتلة من الأعشاب المنافسة، واترك مساحة حول الجذع."],["التشكيل والتقليم","في السنوات الأولى اختر ساقاً رئيسية وبنية متوازنة، وأزل الأغصان المكسورة أو المتزاحمة تدريجياً. لا تزل كمية كبيرة من المجموع الخضري دفعة واحدة."],["التربة والتسميد","تجنب التسميد العشوائي. راقب النمو وحالة الأوراق، واعتمد على تحليل التربة عند ظهور ضعف مستمر أو قبل وضع برنامج تسميد مكثف."]],"ملاحظة: يختلف تحمل البرد والملوحة والنمو باختلاف الأصل والصنف وظروف الموقع."],
["الطماطم","الطماطم تتأثر بتذبذب الماء والحرارة والتغذية؛ والاستقرار في منطقة الجذور يساعد على نمو وإنتاج أكثر انتظاماً.",[["السقي","حافظ على رطوبة متوازنة وتجنب الانتقال المفاجئ من الجفاف إلى الإغراق. بلل التربة قرب الجذور وقلل ابتلال الأوراق قدر الإمكان."],["التغذية","تتغير الاحتياجات بين النمو الخضري والإزهار وتكوين الثمار. لا تفرط في الآزوت، وراعِ توازن العناصر وتحليل الماء والتربة عند توفره."],["مراقبة الأمراض","افحص الأوراق والسيقان والثمار بانتظام. لاحظ نمط البقع وانتشارها والرطوبة والتهوية. أزل الأجزاء المصابة بحذر ونظف الأدوات، ولا تستخدم مبيداً قبل تحديد المشكلة."]],"ملاحظة: تعفن الطرف الزهري قد يرتبط باضطراب انتقال الكالسيوم بسبب تذبذب الماء، وليس بالضرورة بنقص الكالسيوم في التربة."],
["البطيخ","نجاح البطيخ يرتبط بحرارة مناسبة وتربة جيدة الصرف وري متوازن خلال النمو وتكوين الثمار.",[["السقي","تجنب تعطيش النبات ثم إغراقه. راقب الرطوبة في منطقة الجذور، وعدّل السقي حسب نوع التربة والطقس ومرحلة النمو."],["التسميد","اعتمد على تحليل التربة إن أمكن، وتجنب الإفراط في الآزوت الذي قد يشجع النمو الخضري على حساب توازن النبات. لا تعتمد على برنامج واحد لكل الحقول."],["صحة النبات","افحص أسفل الأوراق والسيقان والثمار بحثاً عن الحشرات والبقع والذبول. التهوية الجيدة والدورة الزراعية والنظافة تقلل بعض مخاطر الأمراض."]],"ملاحظة: لا تجرِ رياً أو تسميداً مفاجئاً قرب النضج دون مراعاة حالة الحقل والصنف والطقس."]
]},
fr:{heading:"Guides des cultures",sub:"Conseils pratiques pour les principales cultures.",back:"Retour à l’application",disc:"Ces conseils sont généraux et ne remplacent pas un diagnostic local. Les recommandations dépendent de la variété, du sol, de l’eau, du climat et de l’âge des plantes. Consultez un conseiller agricole avant un traitement ou une dépense importante.",names:["Avocatier","Olivier","Caroubier","Tomate","Pastèque"],guides:[
["Avocatier","L’avocatier est sensible à l’asphyxie racinaire et à la salinité. Il demande un bon drainage et une irrigation régulière sans excès.",[["Eau et drainage","Surveillez l’humidité de la zone racinaire. Évitez l’eau stagnante au pied et vérifiez les goutteurs et les fuites. Les sols sableux sèchent généralement plus vite."],["Nutrition","Basez la fertilisation sur l’analyse du sol et de l’eau ainsi que sur la croissance. Adaptez les apports au stade de l’arbre et évitez l’excès d’azote."],["Observer l’arbre","Surveillez les brûlures marginales, le jaunissement et les chutes de feuilles ou de fruits. Ces signes peuvent avoir plusieurs causes et ne suffisent pas à établir un diagnostic."]],"À retenir : les jeunes arbres nécessitent une attention particulière aux racines et à l’irrigation."],
["Olivier","L’olivier tolère relativement bien la sécheresse une fois établi, mais la production bénéficie d’une gestion équilibrée de l’eau, du sol et de la taille.",[["Irrigation","Les besoins dépendent de l’âge, du sol, des pluies et de la charge en fruits. Évitez les excès, surtout dans les sols mal drainés."],["Taille","La taille vise à améliorer la lumière et l’aération et à retirer le bois mort ou encombré. Évitez les tailles trop sévères."],["Nutrition et récolte","Une analyse du sol ou des feuilles peut aider à choisir la fertilisation. Les besoins varient selon la floraison, la nouaison et la charge de l’année."]],"À retenir : il n’existe pas de dose ou de calendrier universel pour tous les vergers."],
["Caroubier","Le caroubier est adapté aux climats méditerranéens relativement secs après son installation. La réussite dépend beaucoup de la reprise des jeunes plants.",[["Installation","Apportez une irrigation d’appoint selon la sécheresse du sol et la météo, sans engorgement. Limitez la concurrence des mauvaises herbes autour du plant."],["Formation et taille","Pendant les premières années, construisez progressivement une charpente équilibrée. Retirez les branches cassées ou gênantes sans enlever trop de feuillage à la fois."],["Sol et fertilisation","Évitez les apports au hasard. Observez la croissance et les feuilles ; une analyse du sol est utile en cas de faiblesse persistante."]],"À retenir : la résistance au froid, au sel et la vigueur varient selon le matériel végétal et le site."],
["Tomate","La tomate réagit aux variations d’eau, de température et de nutrition. Une humidité régulière dans la zone racinaire favorise une croissance plus stable.",[["Irrigation","Maintenez une humidité régulière et évitez l’alternance sécheresse-engorgement. Arrosez près des racines et limitez le mouillage du feuillage."],["Nutrition","Les besoins évoluent entre croissance végétative, floraison et formation des fruits. Évitez l’excès d’azote et recherchez un équilibre adapté."],["Surveillance sanitaire","Inspectez feuilles, tiges et fruits. Notez la forme des taches, leur progression, l’humidité et l’aération. N’appliquez pas de pesticide sans identifier le problème."]],"À retenir : la nécrose apicale peut être liée à une mauvaise circulation du calcium due aux irrégularités d’eau, pas seulement à un manque de calcium dans le sol."],
["Pastèque","La pastèque demande une température adaptée, un sol bien drainé et une irrigation équilibrée pendant la croissance et la formation des fruits.",[["Irrigation","Évitez le stress hydrique suivi d’un excès d’eau. Ajustez l’apport selon le sol, la météo et le stade de culture."],["Fertilisation","Une analyse du sol est utile. Évitez l’excès d’azote et n’appliquez pas un programme identique à toutes les parcelles."],["Santé des plantes","Inspectez le dessous des feuilles, les tiges et les fruits. L’aération, la rotation et l’hygiène culturale contribuent à limiter certains risques."]],"À retenir : évitez les changements brusques d’irrigation ou de fertilisation en fin de cycle."]
]},
en:{heading:"Crop Guides",sub:"Practical guidance for five common crops.",back:"Back to the app",disc:"These are general guidelines, not a site-specific prescription. Advice depends on variety, soil, water, climate and plant age. Consult a local agronomist before costly decisions or pesticide use.",names:["Avocado","Olive","Carob","Tomato","Watermelon"],guides:[
["Avocado","Avocado is sensitive to waterlogged roots and salinity. It needs good drainage and regular irrigation without excess.",[["Water and drainage","Monitor moisture in the root zone. Avoid standing water around the trunk and check emitters and leaks. Sandy soils generally dry faster."],["Nutrition","Base fertilizer decisions on soil and water tests and observed growth. Adjust to the tree stage and avoid excessive nitrogen."],["Observe the tree","Watch for leaf-edge burn, yellowing, and leaf or fruit drop. These signs can have several causes and do not prove a single diagnosis."]],"Note: young trees need special attention to root health and irrigation."],
["Olive","Once established, olive trees tolerate dry conditions relatively well, but production benefits from balanced water, soil and pruning management.",[["Irrigation","Needs vary with tree age, soil, rainfall and crop load. Avoid overwatering, especially in poorly drained soil."],["Pruning","Pruning aims to improve light and airflow and remove dead or crowded branches. Avoid severe pruning that removes too much canopy at once."],["Nutrition and yield","Soil or leaf analysis can help guide fertilizer choices. Needs change with flowering, fruit set and the crop load each year."]],"Note: there is no universal fertilizer rate or calendar for every orchard."],
["Carob","Carob is adapted to relatively dry Mediterranean conditions once established. Successful establishment is especially important for young trees.",[["Establishment","Provide supplementary irrigation according to soil dryness and weather, without waterlogging. Reduce weed competition around young plants."],["Training and pruning","Build a balanced framework gradually during the early years. Remove broken or crowded branches without removing too much foliage at once."],["Soil and fertilizer","Avoid guesswork. Observe growth and leaves; soil testing can help when poor growth persists."]],"Note: cold and salt tolerance and vigor vary with planting material and site conditions."],
["Tomato","Tomatoes respond to changes in water, temperature and nutrition. Stable root-zone moisture supports more even growth.",[["Irrigation","Maintain steady moisture and avoid cycles of drought and waterlogging. Water near roots and limit wetting the foliage."],["Nutrition","Needs change between vegetative growth, flowering and fruit development. Avoid excess nitrogen and aim for balanced nutrition."],["Plant health","Inspect leaves, stems and fruit. Note spot patterns, spread, humidity and airflow. Do not apply pesticides before identifying the problem."]],"Note: blossom-end rot can be linked to disrupted calcium movement caused by uneven water supply, not only low soil calcium."],
["Watermelon","Watermelon benefits from suitable warmth, well-drained soil and balanced irrigation during growth and fruit development.",[["Irrigation","Avoid drought followed by excessive watering. Adjust irrigation to soil type, weather and crop stage."],["Fertilization","Soil testing is useful. Avoid excess nitrogen and do not assume one fertilizer plan fits every field."],["Plant health","Inspect leaf undersides, stems and fruit. Good airflow, crop rotation and field hygiene help reduce some disease risks."]],"Note: avoid abrupt irrigation or fertilizer changes late in the crop cycle."]
]}
};
let current="ar",selected=0;
function setLang(lang){current=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";let d=data[lang];document.getElementById("heading").textContent=d.heading;document.getElementById("sub").textContent=d.sub;document.getElementById("back").textContent=d.back;document.getElementById("disc").textContent=d.disc;["ar","fr","en"].forEach(x=>document.getElementById(x+"Btn").className=x===lang?"active":"");drawTabs();drawGuide();}
function drawTabs(){let d=data[current];document.getElementById("tabs").innerHTML=d.names.map((n,i)=>`<button type="button" class="${i===selected?"active":""}" onclick="selectGuide(${i})">${n}</button>`).join("");}
function selectGuide(i){selected=i;drawTabs();drawGuide();}
function drawGuide(){let a=data[current].guides[selected];let out=`<article class="guide"><h2>${a[0]}</h2><p>${a[1]}</p>`;a[2].forEach(s=>out+=`<h3>${s[0]}</h3><p>${s[1]}</p>`);out+=`<div class="note">${a[3]}</div></article>`;document.getElementById("guide").innerHTML=out;}
window.setLang=setLang;window.selectGuide=selectGuide;setLang("ar");
</script></body></html>
