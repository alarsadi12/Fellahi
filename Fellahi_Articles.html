<header><div class="wrap"><div class="top"><b>🌱 فلاحي | Fellahi</b><a class="back" href="./index.html" id="back">العودة إلى التطبيق</a></div><h1 id="title">المكتبة الزراعية</h1><div id="subtitle">معلومات عملية تساعدك على العناية بمحاصيلك.</div></div></header>
<main class="wrap"><nav class="controls"><button data-lang="ar" class="active">العربية</button><button data-lang="fr">Français</button><button data-lang="en">English</button></nav><p id="intro">أدلة مبسطة حول التسميد والسقي ومشاكل النباتات.</p><div id="articles"></div></main><footer id="footer">فلاحي — المعرفة الزراعية خطوة نحو محصول أفضل.</footer>
<script>
const D={
ar:{title:"المكتبة الزراعية",subtitle:"معلومات عملية تساعدك على العناية بمحاصيلك واتخاذ قرارات زراعية أفضل.",back:"العودة إلى التطبيق",intro:"ثلاثة أدلة مبسطة حول التسميد والسقي وملاحظة أعراض النباتات.",footer:"فلاحي — المعرفة الزراعية خطوة نحو محصول أفضل.",a:[
["1. التسميد الذكي: ابدأ بالتربة","التسميد الجيد لا يعني إضافة أكبر كمية، بل توفير العنصر الذي يحتاجه النبات بالكمية والتوقيت المناسبين.",[["قبل إضافة السماد","راقب نمو النبات ولون الأوراق، وتحقق من رطوبة التربة والصرف. تحليل التربة، وتحليل ماء السقي عند الحاجة، يساعدان على معرفة الحموضة والملوحة والعناصر المتاحة."],["اختيار السماد والتوقيت","تختلف الحاجات حسب نوع النبات والصنف ومرحلة النمو. احتياجات الشتلة ليست كاحتياجات النبات المثمر. اتبع توصية فنية، وتجنب وضع السماد المركز ملاصقاً للجذور."],["انتبه للأعراض","اصفرار الأوراق أو ضعف النمو لا يعنيان دائماً نقصاً غذائياً؛ فقد ينتجان عن زيادة الماء أو سوء الصرف أو الملوحة أو تلف الجذور. لا تضف عناصر عشوائياً قبل تحديد السبب."]],"نصيحة: سجّل نوع السماد وتاريخ الإضافة والكمية واستجابة النبات. اتبع ملصق المنتج والتوصيات المحلية، ولا تخلط الأسمدة دون التأكد من توافقها."],
["2. تنظيم السقي حسب التربة والطقس","احتياج الماء يتغير مع الحرارة والرياح وعمر النبات ونوع التربة؛ لذلك قد يضر برنامج السقي الثابت بالمحصول.",[["افحص منطقة الجذور","تحقق من الرطوبة على عمق مناسب للجذور، وليس من سطح التربة فقط. التربة الرملية تفقد الماء أسرع غالباً، بينما قد تعاني التربة الثقيلة من بطء الصرف."],["راقب النبات والطقس","زد الانتباه خلال موجات الحر والرياح. الذبول وقت الظهيرة وحده لا يكفي دائماً للحكم على نقص الماء."],["حسّن كفاءة السقي","يساعد التنقيط على توصيل الماء لمنطقة الجذور إذا صُمم وصين جيداً. افحص التسرب وانسداد النقاطات، وتجنب تشبع التربة لأن الجذور تحتاج إلى الأكسجين."]],"نصيحة: سجّل مدة السقي والطقس ورطوبة التربة. عدّل البرنامج تدريجياً، وراعِ ملوحة ماء السقي وجودة الصرف."],
["3. كيف تلاحظ مشاكل النباتات مبكراً؟","التشخيص يبدأ بالملاحظة المنظمة، لكن لا يمكن تأكيد السبب من صورة واحدة أو عرض واحد.",[["سجّل الأعراض","حدد الأوراق التي تأثرت أولاً: القديمة أم الحديثة؟ لاحظ شكل البقع ووجود حشرات أو عفن، وهل المشكلة في نبات واحد أم في مساحة كاملة."],["افحص الظروف المحيطة","راجع آخر عمليات السقي والتسميد والرش، وتغيرات الطقس، وحالة الصرف. توقيت ظهور الأعراض معلومة مفيدة لكنه لا يثبت السبب وحده."],["اتخذ خطوة آمنة","اعزل الشتلات المصابة بشدة إن أمكن، ونظف الأدوات، وتجنب نقل بقايا النباتات المصابة. التقط صوراً واضحة واستشر مهندساً أو مرشداً فلاحياً إذا انتشرت المشكلة."]],"تنبيه: لا تستخدم مبيداً اعتماداً على التخمين. تحقق من تسجيل المنتج للمحصول والآفة في بلدك، واتبع الملصق وفترة الأمان ووسائل الوقاية."]],
fr:{title:"Bibliothèque agricole",subtitle:"Des conseils pratiques pour mieux entretenir vos cultures.",back:"Retour à l’application",intro:"Trois guides sur la fertilisation, l’irrigation et les problèmes des plantes.",footer:"Fellahi — mieux comprendre pour mieux cultiver.",a:[
["1. Fertiliser intelligemment : commencer par le sol","Bien fertiliser ne signifie pas apporter le maximum, mais fournir le bon élément au bon moment et à la bonne dose.",[["Avant tout apport","Observez la croissance, la couleur des feuilles, l’humidité et le drainage. Une analyse du sol et, si nécessaire, de l’eau aide à connaître le pH, la salinité et les éléments disponibles."],["Choisir le produit et le moment","Les besoins varient selon l’espèce, la variété et le stade de développement. Suivez un conseil technique et évitez le contact direct d’un engrais concentré avec les racines."],["Interpréter les symptômes","Le jaunissement ne prouve pas une carence : excès d’eau, mauvais drainage, salinité ou racines abîmées peuvent produire des symptômes similaires."]],"Conseil : notez le produit, la date, la quantité et la réaction des plantes. Respectez l’étiquette et les recommandations locales."],
["2. Adapter l’irrigation au sol et à la météo","Les besoins en eau changent avec la chaleur, le vent, l’âge des plantes et le type de sol.",[["Contrôler l’humidité","Vérifiez l’humidité dans la zone racinaire, pas seulement en surface. Les sols sableux sèchent souvent plus vite ; les sols lourds peuvent drainer lentement."],["Observer les conditions","Soyez attentif pendant les périodes chaudes et venteuses. Un flétrissement uniquement à midi ne confirme pas toujours un manque d’eau."],["Économiser l’eau","Le goutte-à-goutte est utile s’il est bien conçu et entretenu. Vérifiez les fuites et les goutteurs bouchés et évitez l’engorgement du sol."]],"Conseil : notez la durée d’irrigation, la météo et l’humidité. Tenez compte de la salinité de l’eau et du drainage."],
["3. Repérer les problèmes des plantes","Une observation méthodique aide au diagnostic, mais une seule photo ne prouve généralement pas la cause.",[["Décrire les symptômes","Précisez si les feuilles anciennes ou jeunes sont touchées, la forme des taches et la présence d’insectes ou de moisissures."],["Vérifier le contexte","Revoyez les irrigations, fertilisations et traitements récents, la météo et le drainage."],["Agir prudemment","Isolez les plants très atteints si possible, nettoyez les outils et évitez de déplacer les débris suspects. Demandez conseil à un technicien si le problème s’étend."]],"Attention : n’utilisez pas de pesticide au hasard. Vérifiez l’homologation locale, l’étiquette, le délai avant récolte et les protections nécessaires."]]},
en:{title:"Agriculture Library",subtitle:"Practical information to help you care for crops and make better growing decisions.",back:"Back to the app",intro:"Three guides to fertilizing, irrigation and spotting plant problems.",footer:"Fellahi — better knowledge for better growing.",a:[
["1. Smarter fertilizing: start with the soil","Good fertilizing is not about applying the most fertilizer. It is about supplying the right nutrient at the right time and rate.",[["Before applying","Observe growth and leaf colour, then check moisture and drainage. Soil testing, and water testing when needed, can identify pH, salinity and available nutrients."],["Choose product and timing","Needs vary by crop, variety and growth stage. Follow local technical advice and keep concentrated fertilizer away from direct root contact."],["Read symptoms carefully","Yellow leaves do not always mean deficiency. Excess water, poor drainage, salinity or root damage can cause similar symptoms."]],"Tip: record the product, date, amount and plant response. Follow the product label and local recommendations."],
["2. Adjust irrigation to soil and weather","Water needs depend on heat, wind, plant age and soil type, so a fixed schedule may not be suitable.",[["Check root-zone moisture","Check moisture in the root zone, not only at the surface. Sandy soils often dry faster; heavier soils may drain slowly."],["Watch conditions","Pay attention during hot, windy periods. Wilting only at midday does not always confirm water stress."],["Use water efficiently","Drip irrigation can work well when designed and maintained properly. Check for leaks and blocked emitters, and avoid waterlogging."]],"Tip: record irrigation duration, weather and soil moisture. Consider water salinity and soil drainage."],
["3. Spot plant problems early","Careful observation helps diagnosis, but one photo or symptom rarely proves the cause.",[["Describe symptoms","Note whether older or younger leaves are affected, the shape of spots, and whether insects or mould are present."],["Review conditions","Check recent irrigation, fertilizer and spray activities, weather changes and drainage."],["Take safe steps","Separate severely affected seedlings if practical, clean tools and avoid moving suspect debris. Ask a local agronomist for help if the problem spreads."]],"Warning: do not apply pesticides based on a guess. Check local registration, the label, pre-harvest interval and protective equipment."]]}
};
function show(lang){let d=D[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";["title","subtitle","back","intro","footer"].forEach(k=>document.getElementById(k).textContent=d[k]);document.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));document.getElementById("articles").innerHTML=d.a.map(a=>`<article class="article"><h2>${a[0]}</h2><p>${a[1]}</p>${a[2].map(s=>`<h3>${s[0]}</h3><p>${s[1]}</p>`).join("")}<div class="tip">${a[3]}</div></article>`).join("")}
document.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.lang)));show("ar");
</script></body></html>
