
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوق الفلاحي | فلاحي 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f8f5;color:#183329;font-family:Arial,Tahoma}
header{background:#176b45;color:white;padding:25px 18px;border-radius:0 0 22px 22px}
main{max-width:700px;margin:auto;padding:15px}
.card{background:white;padding:16px;border-radius:15px;margin:14px 0}
input,select,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font:inherit}
textarea{min-height:80px}
button{background:#176b45;color:white;border:0;border-radius:9px;padding:12px;width:100%;font-weight:bold;cursor:pointer}
.ad{border-bottom:1px solid #ddd;padding:13px 0}
.price{color:#176b45;font-weight:bold}
small{color:#718078}
a{color:inherit}
</style>
</head>
<body>

<header>
<h2>🧺 السوق الفلاحي</h2>
<p>بيع وشراء المنتجات والمعدات الفلاحية</p>
<a href="index.html">← الرجوع إلى فلاحي 2.0</a>
</header>

<main>
<div class="card">
<h3>➕ نشر إعلان جديد</h3>
<p id="hint">السوق الفلاحي</p>
<input id="title" placeholder="اسم المنتج">

<select id="category">
<option>شتلات وبذور</option>
<option>خضر وفواكه</option>
<option>معدات فلاحية</option>
<option>أسمدة وأدوية</option>
<option>سقي وري</option>
<option>أخرى</option>
</select>

<textarea id="description" placeholder="تفاصيل المنتج"></textarea>
<input id="price" type="number" min="0" placeholder="الثمن بالدرهم">
<input id="city" placeholder="المدينة أو المنطقة">
<input id="phone" placeholder="رقم الهاتف">
<input id="image" type="file" accept="image/*">

<button id="publish">نشر الإعلان</button>
<p id="message"></p>
</div>

<div class="card">
<h3>🔎 إعلانات السوق</h3>
<input id="search" placeholder="ابحث عن منتج أو مدينة">

<select id="filter">
<option value="">جميع الأصناف</option>
<option>شتلات وبذور</option>
<option>خضر وفواكه</option>
<option>معدات فلاحية</option>
<option>أسمدة وأدوية</option>
<option>سقي وري</option>
<option>أخرى</option>
</select>

<div id="ads">جاري تحميل الإعلانات...</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const db = window.supabase.createClient(
  "https://kldxlodykkomkresegyt.supabase.co",
  "sb_publishable_AOy4zEw5LYHklwYOaQGmoA_G01FCILJ"
);

const $ = id => document.getElementById(id);

let user = null;
let allAds = [];
let editingAdId = null;

function message(t) {
  $("message").textContent = t;
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

async function loadAds() {
  const { data, error } = await db
    .from("market_ads")
    .select("*")
    .eq("status", "active")
    .order("created_at", { ascending: false });

  if (error) {
    $("ads").textContent = "تعذر تحميل الإعلانات: " + error.message;
    return;
  }

  allAds = data || [];
  renderAds();
}

function renderAds() {
  const q = $("search").value.toLowerCase().trim();
  const cat = $("filter").value;

  const rows = allAds.filter(a =>
    (!cat || a.category === cat) &&
    (!q || [a.title, a.city, a.description, a.category]
      .join(" ").toLowerCase().includes(q))
  );

  if (!rows.length) {
    $("ads").textContent = "لا توجد إعلانات حالياً.";
    return;
  }

  $("ads").innerHTML = rows.map(a => {
    const phone = a.phone
      ? '<p>📞 <a href="tel:' + esc(a.phone) + '">' + esc(a.phone) + '</a></p>'
      : "";

    const ownerButtons = user && a.user_id === user.id
      ? '<button data-edit="' + esc(a.id) + '" style="margin-top:8px">✏️ تعديل الإعلان</button>' +
        '<button data-delete="' + esc(a.id) + '" style="margin-top:8px;background:#b42318">🗑️ حذف الإعلان</button>'
      : "";

    return '<div class="ad">' +
      (a.image_url
        ? '<img src="' + esc(a.image_url) + '" alt="' + esc(a.title) + '" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:10px">'
        : '') +
      '<h3>' + esc(a.title) + '</h3>' +
      '<small>' + esc(a.category) + ' · ' + esc(a.city || "") + '</small>' +
      '<p>' + esc(a.description || "") + '</p>' +
      '<div class="price">' +
      (a.price !== null ? esc(a.price) + " درهم" : "الثمن عند التواصل") +
      '</div>' + phone + ownerButtons +
      '</div>';
  }).join("");
}

$("publish").onclick = async function() {
  if (!user) {
    message("سجل الدخول أولاً من المجتمع الفلاحي.");
    return;
  }

  const title = $("title").value.trim();
  const category = $("category").value;
  const description = $("description").value.trim();
  const priceValue = $("price").value;
  const city = $("city").value.trim();
  const phone = $("phone").value.trim();
  const file = $("image").files[0];

  if (!title || !city || !phone) {
    message("عمر اسم المنتج والمدينة ورقم الهاتف.");
    return;
  }

  if (priceValue !== "" && Number(priceValue) < 0) {
    message("الثمن غير صالح.");
    return;
  }

  if (file && !file.type.startsWith("image/")) {
    message("اختار صورة فقط.");
    return;
  }

  if (file && file.size > 5 * 1024 * 1024) {
    message("الصورة خاصها تكون أقل من 5 ميغابايت.");
    return;
  }

  let imageUrl = null;

  if (editingAdId) {
    const oldAd = allAds.find(
      a => String(a.id) === String(editingAdId)
    );

    if (!oldAd || oldAd.user_id !== user.id) {
      message("تعذر العثور على إعلانك.");
      return;
    }

    imageUrl = oldAd.image_url || null;
  }

  if (file) {
    message("جاري رفع الصورة...");

    const ext = file.name.split(".").pop().toLowerCase()
      .replace(/[^a-z0-9]/g, "") || "jpg";

    const path = user.id + "/" + Date.now() + "." + ext;

    const { error: uploadError } = await db.storage
      .from("fellahi-images")
      .upload(path, file, { cacheControl: "3600" });

    if (uploadError) {
      message("تعذر رفع الصورة: " + uploadError.message);
      return;
    }

    const { data: publicData } = db.storage
      .from("fellahi-images")
      .getPublicUrl(path);

    imageUrl = publicData.publicUrl;
  }

  message("جاري حفظ الإعلان...");

  const adData = {
    title,
    category,
    description,
    price: priceValue === "" ? null : Number(priceValue),
    city,
    phone,
    image_url: imageUrl,
    status: "active"
  };

  let error = null;

  if (editingAdId) {
    const result = await db
      .from("market_ads")
      .update(adData)
      .eq("id", editingAdId)
      .eq("user_id", user.id)
      .select("id");

    error = result.error;

    if (!error && (!result.data || result.data.length === 0)) {
      message("لم يتم تعديل الإعلان. تحقق من الصلاحيات.");
      return;
    }
  } else {
    const result = await db
      .from("market_ads")
      .insert({
        ...adData,
        user_id: user.id
      });

    error = result.error;
  }

  if (error) {
    message("تعذر حفظ الإعلان: " + error.message);
    return;
  }

  const wasEditing = !!editingAdId;

  message(wasEditing
    ? "تم تعديل الإعلان بنجاح!"
    : "تم نشر الإعلان بنجاح!"
  );

  editingAdId = null;
  $("publish").textContent = "نشر الإعلان";

  $("title").value = "";
  $("category").selectedIndex = 0;
  $("description").value = "";
  $("price").value = "";
  $("city").value = "";
  $("phone").value = "";
  $("image").value = "";

  await loadAds();
};

$("ads").onclick = async function(e) {
  const editButton = e.target.closest("[data-edit]");
  const deleteButton = e.target.closest("[data-delete]");

  if (editButton) {
    const editId = editButton.getAttribute("data-edit");

    const ad = allAds.find(
      a => String(a.id) === editId
    );

    if (!ad || !user || ad.user_id !== user.id) {
      message("لا يمكنك تعديل هذا الإعلان.");
      return;
    }

    editingAdId = ad.id;

    $("title").value = ad.title || "";
    $("category").value = ad.category || "";
    $("description").value = ad.description || "";
    $("price").value = ad.price ?? "";
    $("city").value = ad.city || "";
    $("phone").value = ad.phone || "";
    $("image").value = "";

    $("publish").textContent = "حفظ التعديل";
    message("بدّل المعلومات ثم اضغط حفظ التعديل.");
    window.scrollTo(0, 0);
    return;
  }

  if (deleteButton) {
    if (!user) {
      message("سجل الدخول أولاً.");
      return;
    }

    const deleteId = deleteButton.getAttribute("data-delete");

    if (!confirm("واش متأكد أنك باغي تحذف هاد الإعلان؟")) return;

    const { error } = await db
      .from("market_ads")
      .delete()
      .eq("id", deleteId)
      .eq("user_id", user.id);

    if (error) {
      message("تعذر حذف الإعلان: " + error.message);
      return;
    }

    message("تم حذف الإعلان بنجاح.");
    await loadAds();
  }
};

$("search").oninput = renderAds;
$("filter").onchange = renderAds;

async function startMarket() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    message("تعذر التحقق من تسجيل الدخول: " + error.message);
  }

  user = data?.session?.user || null;

  await loadAds();

  db.auth.onAuthStateChange((_event, session) => {
    user = session?.user || null;
    renderAds();
  });
}

startMarket();
</script>
</body>
</html>
