
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السوق الفلاحي | فلاحي 2.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f2f5;color:#183329;font-family:Arial,Tahoma}
header{background:#176b45;color:white;padding:20px 16px;border-radius:0 0 20px 20px}
header a{color:white}
main{max-width:700px;margin:auto;padding:12px}
.card,.post{background:white;padding:16px;border-radius:14px;margin:13px 0;box-shadow:0 1px 4px #0000000c}
input,select,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font:inherit}
textarea{min-height:75px;resize:vertical}
button{background:#176b45;color:white;border:0;border-radius:9px;padding:11px;font:inherit;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
small{color:#718078}
a{color:inherit}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#e2f2e8;display:flex;align-items:center;justify-content:center;font-size:21px}
.post-image{width:100%;max-height:330px;object-fit:cover;border-radius:10px;margin:10px 0}
.post-title{margin:4px 0}
.post-description{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.price{color:#176b45;font-weight:bold;font-size:18px;margin:10px 0}
.post-stats{display:flex;justify-content:space-between;color:#718078;font-size:13px;padding:9px 2px;border-bottom:1px solid #eee}
.post-actions{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid #eee}
.post-actions button{flex:1;background:#f2f4f5;color:#46534b}
.post-actions button.liked{background:#fff0f0;color:#d12c45}
.post-actions button:active{transform:scale(.98)}
.comments-area{padding-top:12px}
.toggle-comments{width:100%;background:#f0f2f5;color:#176b45;margin-top:10px}
.comments-content{padding-top:12px}
.comments-title{font-weight:bold;margin-bottom:10px}
.comment{display:flex;gap:8px;margin:12px 0;align-items:flex-start}
.comment-avatar{width:32px;height:32px;flex-shrink:0;border-radius:50%;background:#e8f1eb;display:flex;align-items:center;justify-content:center}
.comment-content{background:#f0f2f5;border-radius:14px;padding:9px 12px;flex:1;min-width:0}
.comment-content p{margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.comment-meta{font-size:11px;color:#718078}
.comment-delete{background:none;color:#b42318;padding:3px 6px;font-size:12px;width:auto}
.comment-form{display:flex;gap:7px;align-items:center;margin-top:12px}
.comment-form textarea{min-height:43px;height:43px;margin:0;flex:1;border-radius:20px}
.comment-form button{border-radius:20px;white-space:nowrap;padding:11px 14px}
.owner-actions{display:flex;gap:8px;margin-top:12px}
.owner-actions button{flex:1}
#notificationPanel{display:none;background:white;color:#183329;border-radius:12px;padding:12px;margin-top:12px}
.notification{padding:11px;border-bottom:1px solid #eee;cursor:pointer}
.notification.unread{background:#eff8f1}
.notification p{margin:4px 0}
#bell{width:auto;background:#fff;color:#176b45;padding:9px 13px}
#bell-count{background:#d12c45;color:white;border-radius:20px;padding:2px 7px;font-size:12px}
.empty{color:#718078;text-align:center;padding:20px}
</style>
</head>
<body>

<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <div>
      <h2 style="margin:0">🧺 السوق الفلاحي</h2>
      <p style="margin:7px 0">بيع وشراء المنتجات والمعدات الفلاحية</p>
    </div>
    <button id="bell">🔔 <span id="bell-count">0</span></button>
  </div>
  <a href="index.html">← الرجوع إلى فلاحي 2.0</a>
  <div id="notificationPanel">
    <h3 style="margin-top:4px">🔔 إشعاراتك</h3>
    <div id="notificationsList">جاري التحميل...</div>
  </div>
</header>

<main>
  <div class="card">
    <h3>➕ نشر إعلان جديد</h3>
    <p id="hint">السوق الفلاحي</p>
    <input id="title" placeholder="اسم المنتج">

    <select id="category">
      <option>شتلات وبذور</option>
      <option>خضر وفواكه</option>
      <option>معدات فلاحية</option>
      <option>أسمدة وأدوية</option>
      <option>سقي وري</option>
      <option>أخرى</option>
    </select>

    <textarea id="description" placeholder="تفاصيل المنتج"></textarea>
    <input id="price" type="number" min="0" placeholder="الثمن بالدرهم">
    <input id="city" placeholder="المدينة أو المنطقة">
    <input id="phone" placeholder="رقم الهاتف">
    <input id="image" type="file" accept="image/*">

    <button id="publish" style="width:100%">نشر الإعلان</button>
    <p id="message"></p>
  </div>

  <div class="card">
    <h3>🔎 إعلانات السوق</h3>
    <input id="search" placeholder="ابحث عن منتج أو مدينة">
    <select id="filter">
      <option value="">جميع الأصناف</option>
      <option>شتلات وبذور</option>
      <option>خضر وفواكه</option>
      <option>معدات فلاحية</option>
      <option>أسمدة وأدوية</option>
      <option>سقي وري</option>
      <option>أخرى</option>
    </select>
    <div id="ads">جاري تحميل الإعلانات...</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  "https://kldxlodykkomkresegyt.supabase.co",
  "sb_publishable_AOy4zEw5LYHklwYOaQGmoA_G01FCILJ"
);

const $ = id => document.getElementById(id);

let user = null;
let allAds = [];
let allComments = [];
let allLikes = [];
let allNotifications = [];
let editingAdId = null;
let openCommentAds = new Set();

function message(t) {
  $("message").textContent = t;
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function dateText(value) {
  if (!value) return "";
  return new Date(value).toLocaleString("ar-MA");
}

async function loadNotifications() {
  if (!user) {
    allNotifications = [];
    renderNotifications();
    return;
  }

  const {data,error} = await db
    .from("market_notifications")
    .select("*")
    .eq("recipient_id",user.id)
    .order("created_at",{ascending:false})
    .limit(30);

  if (error) {
    $("notificationsList").textContent = "تعذر تحميل الإشعارات: " + error.message;
    return;
  }

  allNotifications = data || [];
  renderNotifications();
}

function renderNotifications() {
  const unread = allNotifications.filter(n => !n.read_at).length;
  $("bell-count").textContent = unread;

  if (!user) {
    $("notificationsList").innerHTML =
      '<div class="empty">سجل الدخول باش تشوف إشعاراتك.</div>';
    return;
  }

  if (!allNotifications.length) {
    $("notificationsList").innerHTML =
      '<div class="empty">ما عندك حتى إشعار دابا.</div>';
    return;
  }

  $("notificationsList").innerHTML = allNotifications.map(n => {
    const label = n.notification_type === "like"
      ? "❤️ أعجب أحد المستخدمين بإعلانك"
      : "💬 كتب أحد المستخدمين تعليقاً على إعلانك";

    return '<div class="notification ' + (!n.read_at ? "unread" : "") +
      '" data-notification="' + esc(n.id) +
      '" data-ad="' + esc(n.ad_id) + '">' +
      '<p>' + label + '</p>' +
      '<small>' + esc(dateText(n.created_at)) + '</small>' +
      '</div>';
  }).join("");
}

async function loadAds() {
  const {data,error} = await db
    .from("market_ads")
    .select("*")
    .eq("status","active")
    .order("created_at",{ascending:false});

  if (error) {
    $("ads").textContent = "تعذر تحميل الإعلانات: " + error.message;
    return;
  }

  allAds = data || [];

  if (allAds.length) {
    const ids = allAds.map(a => a.id);

    const [cr,lr] = await Promise.all([
      db.from("market_comments")
        .select("*")
        .in("ad_id",ids)
        .order("created_at",{ascending:true}),
      db.from("market_likes")
        .select("*")
        .in("ad_id",ids)
    ]);

    if (cr.error) {
      message("تعذر تحميل التعليقات: " + cr.error.message);
      allComments = [];
    } else {
      allComments = cr.data || [];
    }

    if (lr.error) {
      message("تعذر تحميل الإعجابات: " + lr.error.message);
      allLikes = [];
    } else {
      allLikes = lr.data || [];
    }
  } else {
    allComments = [];
    allLikes = [];
  }

  renderAds();
}

function renderAds() {
  const q = $("search").value.toLowerCase().trim();
  const cat = $("filter").value;

  const rows = allAds.filter(a =>
    (!cat || a.category === cat) &&
    (!q || [a.title,a.city,a.description,a.category]
      .join(" ").toLowerCase().includes(q))
  );

  if (!rows.length) {
    $("ads").innerHTML = '<div class="empty">لا توجد إعلانات حالياً.</div>';
    return;
  }

  $("ads").innerHTML = rows.map(a => {
    const comments = allComments.filter(c => c.ad_id === a.id);
    const likes = allLikes.filter(l => l.ad_id === a.id);
    const liked = user && likes.some(l => l.user_id === user.id);
    const commentsOpen = openCommentAds.has(a.id);

    const phone = a.phone
      ? '<p>📞 <a href="tel:' + esc(a.phone) + '">' + esc(a.phone) + '</a></p>'
      : "";

    const ownerButtons = user && a.user_id === user.id
      ? '<div class="owner-actions">' +
        '<button data-edit="' + esc(a.id) + '">✏️ تعديل</button>' +
        '<button data-delete="' + esc(a.id) + '" style="background:#b42318">🗑️ حذف</button>' +
        '</div>'
      : "";

    const commentHtml = comments.length
      ? comments.map(c =>
          '<div class="comment">' +
          '<div class="comment-avatar">👤</div>' +
          '<div class="comment-content">' +
          '<div class="comment-meta">مستخدم · ' + esc(dateText(c.created_at)) + '</div>' +
          '<p>' + esc(c.content) + '</p>' +
          (user && c.user_id === user.id
            ? '<button class="comment-delete" data-comment-delete="' + esc(c.id) + '">حذف التعليق</button>'
            : '') +
          '</div></div>'
        ).join("")
      : '<div class="empty">باقي ما كاين حتى تعليق. بدا النقاش!</div>';

    const commentForm = user
      ? '<div class="comment-form">' +
        '<textarea data-comment-input="' + esc(a.id) + '" placeholder="اكتب تعليقاً..."></textarea>' +
        '<button data-comment-submit="' + esc(a.id) + '">إرسال</button>' +
        '</div>'
      : '<p><small>سجل الدخول باش تقدر تعلق.</small></p>';

    return '<article class="post" id="ad-' + esc(a.id) + '">' +
      '<div class="post-head">' +
      '<div class="avatar">🌱</div>' +
      '<div><strong>إعلان فلاحي</strong><br><small>' +
      esc(a.city || "") + ' · ' + esc(dateText(a.created_at)) +
      '</small></div></div>' +

      '<h3 class="post-title">' + esc(a.title) + '</h3>' +
      '<small>' + esc(a.category) + '</small>' +
      '<p class="post-description">' + esc(a.description || "") + '</p>' +

      (a.image_url
        ? '<img class="post-image" src="' + esc(a.image_url) + '" alt="' + esc(a.title) + '">'
        : '') +

      '<div class="price">' +
      (a.price !== null ? esc(a.price) + " درهم" : "الثمن عند التواصل") +
      '</div>' + phone +

      '<div class="post-stats">' +
      '<span>❤️ ' + likes.length + ' إعجاب</span>' +
      '<span>💬 ' + comments.length + ' تعليق</span>' +
      '</div>' +

      '<div class="post-actions">' +
      '<button class="' + (liked ? "liked" : "") +
      '" data-like="' + esc(a.id) + '">' +
      (liked ? "❤️ أعجبني" : "🤍 إعجاب") + '</button>' +
      '<button data-focus-comment="' + esc(a.id) + '">💬 تعليق</button>' +
      '</div>' +

      '<section class="comments-area">' +
      '<button class="toggle-comments" data-toggle-comments="' + esc(a.id) + '">' +
      (commentsOpen ? '🔼 إخفاء التعليقات' : '💬 عرض التعليقات') +
      ' (' + comments.length + ')' +
      '</button>' +

      '<div class="comments-content" id="comments-' + esc(a.id) +
      '" style="display:' + (commentsOpen ? 'block' : 'none') + '">' +
      '<div class="comments-title">💬 التعليقات</div>' +
      commentHtml + commentForm +
      '</div>' +
      '</section>' +

      ownerButtons +
      '</article>';
  }).join("");
}

$("publish").onclick = async function() {
  if (!user) {
    message("سجل الدخول أولاً من المجتمع الفلاحي.");
    return;
  }

  const title = $("title").value.trim();
  const category = $("category").value;
  const description = $("description").value.trim();
  const priceValue = $("price").value;
  const city = $("city").value.trim();
  const phone = $("phone").value.trim();
  const file = $("image").files[0];

  if (!title || !city || !phone) {
    message("عمر اسم المنتج والمدينة ورقم الهاتف.");
    return;
  }

  if (priceValue !== "" && Number(priceValue) < 0) {
    message("الثمن غير صالح.");
    return;
  }

  if (file && !file.type.startsWith("image/")) {
    message("اختار صورة فقط.");
    return;
  }

  if (file && file.size > 5 * 1024 * 1024) {
    message("الصورة خاصها تكون أقل من 5 ميغابايت.");
    return;
  }

  let imageUrl = null;

  if (editingAdId) {
    const oldAd = allAds.find(a => String(a.id) === String(editingAdId));

    if (!oldAd || oldAd.user_id !== user.id) {
      message("تعذر العثور على إعلانك.");
      return;
    }

    imageUrl = oldAd.image_url || null;
  }

  if (file) {
    message("جاري رفع الصورة...");

    const ext = file.name.split(".").pop().toLowerCase()
      .replace(/[^a-z0-9]/g,"") || "jpg";

    const path = user.id + "/" + Date.now() + "." + ext;

    const {error:uploadError} = await db.storage
      .from("fellahi-images")
      .upload(path,file,{cacheControl:"3600"});

    if (uploadError) {
      message("تعذر رفع الصورة: " + uploadError.message);
      return;
    }

    const {data:publicData} = db.storage
      .from("fellahi-images")
      .getPublicUrl(path);

    imageUrl = publicData.publicUrl;
  }

  message("جاري حفظ الإعلان...");

  const adData = {
    title,category,description,
    price:priceValue === "" ? null : Number(priceValue),
    city,phone,image_url:imageUrl,status:"active"
  };

  let error = null;

  if (editingAdId) {
    const result = await db.from("market_ads")
      .update(adData)
      .eq("id",editingAdId)
      .eq("user_id",user.id)
      .select("id");

    error = result.error;

    if (!error && (!result.data || !result.data.length)) {
      message("لم يتم تعديل الإعلان. تحقق من الصلاحيات.");
      return;
    }
  } else {
    const result = await db.from("market_ads")
      .insert({...adData,user_id:user.id});

    error = result.error;
  }

  if (error) {
    message("تعذر حفظ الإعلان: " + error.message);
    return;
  }

  message(editingAdId ? "تم تعديل الإعلان بنجاح!" : "تم نشر الإعلان بنجاح!");

  editingAdId = null;
  $("publish").textContent = "نشر الإعلان";
  $("title").value = "";
  $("category").selectedIndex = 0;
  $("description").value = "";
  $("price").value = "";
  $("city").value = "";
  $("phone").value = "";
  $("image").value = "";

  await loadAds();
};

$("ads").onclick = async function(e) {
  const likeButton = e.target.closest("[data-like]");
  const commentButton = e.target.closest("[data-comment-submit]");
  const commentDelete = e.target.closest("[data-comment-delete]");
  const focusComment = e.target.closest("[data-focus-comment]");
  const toggleComments = e.target.closest("[data-toggle-comments]");
  const editButton = e.target.closest("[data-edit]");
  const deleteButton = e.target.closest("[data-delete]");

  if (toggleComments) {
    const id = toggleComments.dataset.toggleComments;

    if (openCommentAds.has(id)) {
      openCommentAds.delete(id);
    } else {
      openCommentAds.add(id);
    }

    renderAds();
    return;
  }

  if (likeButton) {
    if (!user) {
      message("سجل الدخول من المجتمع الفلاحي باش تدير إعجاب.");
      return;
    }

    const adId = likeButton.dataset.like;
    const existing = allLikes.find(l => l.ad_id === adId && l.user_id === user.id);

    likeButton.disabled = true;

    const result = existing
      ? await db.from("market_likes").delete()
          .eq("ad_id",adId).eq("user_id",user.id)
      : await db.from("market_likes").insert({
          ad_id:adId,user_id:user.id
        });

    if (result.error) {
      message("تعذر تغيير الإعجاب: " + result.error.message);
      likeButton.disabled = false;
      return;
    }

    await loadAds();
    await loadNotifications();
    return;
  }

  if (focusComment) {
    const id = focusComment.dataset.focusComment;

    openCommentAds.add(id);
    renderAds();

    const box = document.querySelector(
      '[data-comment-input="' + id + '"]'
    );

    if (box) {
      box.focus();
      box.scrollIntoView({behavior:"smooth",block:"center"});
    }
    return;
  }

  if (commentButton) {
    if (!user) {
      message("سجل الدخول أولاً باش تقدر تعلق.");
      return;
    }

    const adId = commentButton.dataset.commentSubmit;
    const area = commentButton.closest(".comment-form");
    const textarea = area.querySelector("textarea");
    const content = textarea.value.trim();

    if (!content) {
      message("كتب التعليق ديالك أولاً.");
      return;
    }

    if (content.length > 2000) {
      message("التعليق طويل بزاف. اختصره شوية.");
      return;
    }

    commentButton.disabled = true;
    commentButton.textContent = "جاري الإرسال...";

    const {error} = await db.from("market_comments").insert({
      ad_id:adId,user_id:user.id,content
    });

    if (error) {
      message("تعذر إرسال التعليق: " + error.message);
      commentButton.disabled = false;
      commentButton.textContent = "إرسال";
      return;
    }

    openCommentAds.add(adId);
    message("تم إرسال تعليقك بنجاح.");
    await loadAds();
    await loadNotifications();
    return;
  }

  if (commentDelete) {
    if (!user) return;

    const id = commentDelete.dataset.commentDelete;
    if (!confirm("واش متأكد أنك باغي تحذف تعليقك؟")) return;

    const {error} = await db.from("market_comments")
      .delete().eq("id",id).eq("user_id",user.id);

    if (error) {
      message("تعذر حذف التعليق: " + error.message);
      return;
    }

    message("تم حذف التعليق.");
    await loadAds();
    return;
  }

  if (editButton) {
    const ad = allAds.find(a => String(a.id) === editButton.dataset.edit);

    if (!ad || !user || ad.user_id !== user.id) {
      message("لا يمكنك تعديل هذا الإعلان.");
      return;
    }

    editingAdId = ad.id;
    $("title").value = ad.title || "";
    $("category").value = ad.category || "";
    $("description").value = ad.description || "";
    $("price").value = ad.price ?? "";
    $("city").value = ad.city || "";
    $("phone").value = ad.phone || "";
    $("image").value = "";
    $("publish").textContent = "حفظ التعديل";
    message("بدّل المعلومات ثم اضغط حفظ التعديل.");
    window.scrollTo(0,0);
    return;
  }

  if (deleteButton) {
    if (!user) {
      message("سجل الدخول أولاً.");
      return;
    }

    const id = deleteButton.dataset.delete;
    if (!confirm("واش متأكد أنك باغي تحذف هاد الإعلان؟")) return;

    const {error} = await db.from("market_ads")
      .delete().eq("id",id).eq("user_id",user.id);

    if (error) {
      message("تعذر حذف الإعلان: " + error.message);
      return;
    }

    openCommentAds.delete(id);
    message("تم حذف الإعلان بنجاح.");
    await loadAds();
    await loadNotifications();
  }
};

$("bell").onclick = () => {
  const panel = $("notificationPanel");
  panel.style.display = panel.style.display === "block" ? "none" : "block";
  if (panel.style.display === "block") loadNotifications();
};

$("notificationsList").onclick = async function(e) {
  const item = e.target.closest("[data-notification]");
  if (!item) return;

  const notification = allNotifications.find(n => n.id === item.dataset.notification);
  if (!notification) return;

  if (!notification.read_at) {
    const {error} = await db.from("market_notifications")
      .update({read_at:new Date().toISOString()})
      .eq("id",notification.id)
      .eq("recipient_id",user.id);

    if (error) {
      message("تعذر تحديث الإشعار: " + error.message);
    }
  }

  $("notificationPanel").style.display = "none";
  await loadNotifications();

  const post = document.getElementById("ad-" + notification.ad_id);
  if (post) {
    post.scrollIntoView({behavior:"smooth",block:"center"});
    post.style.outline = "2px solid #176b45";
    setTimeout(() => post.style.outline = "",1800);
  }
};

$("search").oninput = renderAds;
$("filter").onchange = renderAds;

async function startMarket() {
  const {data,error} = await db.auth.getSession();

  if (error) message("تعذر التحقق من تسجيل الدخول: " + error.message);

  user = data?.session?.user || null;

  await loadAds();
  await loadNotifications();

  db.auth.onAuthStateChange((_event,session) => {
    user = session?.user || null;
    renderAds();
    loadNotifications();
  });
}

startMarket();
</script>
